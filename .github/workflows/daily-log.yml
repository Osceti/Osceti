name: Daily log

on:
  schedule:
    - cron: "17 9 * * *" # tous les jours vers 10h/11h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append today's entry
        env:
          COMMIT_EMAIL: ${{ secrets.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_EMAIL" ]; then
            echo "Secret COMMIT_EMAIL manquant" >&2
            exit 1
          fi
          mkdir -p log
          date -u +"%Y-%m-%d" >> log/daily.txt
          git config user.name "Oscar Zinetti"
          git config user.email "$COMMIT_EMAIL"
          git add log/daily.txt
          git commit -m "Daily log $(date -u +%Y-%m-%d)"
          git push
